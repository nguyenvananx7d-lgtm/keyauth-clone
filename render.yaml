services:
  - type: web
    name: keyauth-clone
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://keyauth-clone.onrender.com
      # OAuth — fill in values from your Google/GitHub/Discord apps
      # (leave empty to disable a provider)
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GITHUB_CLIENT_ID
        value: ""
      - key: GITHUB_CLIENT_SECRET
        value: ""
      - key: DISCORD_CLIENT_ID
        value: ""
      - key: DISCORD_CLIENT_SECRET
        value: ""
      # DATABASE_URL — add your Render PostgreSQL connection string here
      # so accounts persist across redeploys.
      - key: DATABASE_URL
        value: ""
